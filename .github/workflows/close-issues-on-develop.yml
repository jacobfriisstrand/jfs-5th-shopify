# Auto-close issues referenced by a PR when it merges into `develop`.
#
# GitHub's built-in `Closes #N` keyword only fires when a PR merges into the
# repo default branch (here: `main`). Day-to-day work merges into `develop`,
# which would otherwise leave referenced issues open until the eventual
# `develop → main` release merge. This workflow plugs that gap.
#
# Trigger: pull_request `closed` event, only when the PR was actually merged
# AND the base ref was `develop`. PRs targeting `main` are intentionally
# skipped — the platform handles those.
#
# Tracked in #28.

name: close-issues-on-develop

on:
  pull_request:
    types: [closed]
    branches: [develop]

permissions:
  issues: write
  pull-requests: read

jobs:
  close-referenced-issues:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Close issues referenced in PR body
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || "";
            const prNumber = context.payload.pull_request.number;

            // Match GitHub's closing-keyword grammar:
            // close, closes, closed, fix, fixes, fixed, resolve, resolves, resolved
            // followed by `#N` (same-repo references only).
            const re = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi;

            const issues = new Set();
            for (const match of body.matchAll(re)) {
              issues.add(Number(match[1]));
            }

            if (issues.size === 0) {
              core.info("No closing keywords found in PR body; nothing to do.");
              return;
            }

            for (const issueNumber of issues) {
              try {
                const { data: issue } = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                });

                if (issue.state === "closed") {
                  core.info(`#${issueNumber} already closed; skipping.`);
                  continue;
                }
                if (issue.pull_request) {
                  core.info(`#${issueNumber} is a PR, not an issue; skipping.`);
                  continue;
                }

                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body: `Closed by #${prNumber} (merged into \`develop\`).`,
                });

                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  state: "closed",
                  state_reason: "completed",
                });

                core.info(`Closed #${issueNumber}.`);
              } catch (err) {
                core.warning(`Failed to close #${issueNumber}: ${err.message}`);
              }
            }
