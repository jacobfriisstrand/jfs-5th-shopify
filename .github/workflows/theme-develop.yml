# Auto-deploy the current `develop` branch to a fixed unpublished theme.
#
# This gives the branch a stable QA target between per-PR previews and the
# published `Production` theme deployed from `main`.
#
# Required repository secrets are the same as `theme-preview.yml`:
#   SHOPIFY_CLI_THEME_TOKEN  Theme Access app token for the preview store
#   SHOPIFY_FLAG_STORE       Preview store domain

name: theme-develop

on:
  push:
    branches: [develop]
  workflow_dispatch:

# Serialize deploys to the shared Develop theme. A force-push or rapid follow-up
# commit should replace the in-flight deploy instead of racing it.
concurrency:
  group: theme-develop
  cancel-in-progress: true

jobs:
  deploy:
    name: Push develop theme
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
      SHOPIFY_FLAG_STORE: ${{ secrets.SHOPIFY_FLAG_STORE }}
      THEME_NAME: Develop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build theme
        run: npm run build

      - name: Resolve existing Develop theme ID
        id: resolve
        run: |
          set -euo pipefail
          # List all themes and find one named exactly "Develop" (not "PR #…"
          # preview themes). If found, push by ID to guarantee we update the
          # same record. If not found, push by name to create it.
          THEMES_JSON="$(npx shopify theme list --json)"
          EXISTING_ID="$(echo "$THEMES_JSON" | jq -r '.[] | select(.name == "'"$THEME_NAME"'") | .id' | head -1)"
          if [ -n "$EXISTING_ID" ] && [ "$EXISTING_ID" != "null" ]; then
            echo "Found existing theme \"$THEME_NAME\" (id $EXISTING_ID)"
            echo "theme_ref=$EXISTING_ID" >> "$GITHUB_OUTPUT"
            echo "is_new=false" >> "$GITHUB_OUTPUT"
          else
            echo "No existing theme named \"$THEME_NAME\" — will create one"
            echo "theme_ref=$THEME_NAME" >> "$GITHUB_OUTPUT"
            echo "is_new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push unpublished theme
        id: push
        run: |
          set -euo pipefail
          OUTPUT="$(npx shopify theme push \
            --unpublished \
            --json \
            --theme "${{ steps.resolve.outputs.theme_ref }}")"
          echo "$OUTPUT"
          PREVIEW_URL="$(echo "$OUTPUT" | jq -r '.theme.preview_url // .preview_url')"
          EDITOR_URL="$(echo "$OUTPUT" | jq -r '.theme.editor_url // .editor_url')"
          THEME_ID="$(echo "$OUTPUT" | jq -r '.theme.id // .id')"
          {
            echo "preview_url=$PREVIEW_URL"
            echo "editor_url=$EDITOR_URL"
            echo "theme_id=$THEME_ID"
          } >> "$GITHUB_OUTPUT"

      - name: Delete orphaned Develop theme duplicates
        if: steps.resolve.outputs.is_new == 'false'
        run: |
          set -euo pipefail
          TARGET_ID="${{ steps.push.outputs.theme_id }}"
          THEMES_JSON="$(npx shopify theme list --json)"
          # Delete any unpublished theme named exactly "Develop" whose ID
          # differs from the one we just pushed to.
          DUPLICATES="$(echo "$THEMES_JSON" | jq -r '.[] | select(.name == "'"$THEME_NAME"'" and .id != '"$TARGET_ID"' and .role == "unpublished") | .id')"
          if [ -n "$DUPLICATES" ]; then
            for DUP_ID in $DUPLICATES; do
              echo "Deleting orphaned duplicate theme $DUP_ID"
              npx shopify theme delete --force --theme "$DUP_ID"
            done
          else
            echo "No duplicate Develop themes found"
          fi

      - name: Summary
        run: |
          {
            echo "### Develop theme updated"
            echo ""
            echo "| | URL |"
            echo "| --- | --- |"
            echo "| Storefront | ${{ steps.push.outputs.preview_url }} |"
            echo "| Theme editor | ${{ steps.push.outputs.editor_url }} |"
            echo ""
            echo "Theme: \`${THEME_NAME}\` (id \`${{ steps.push.outputs.theme_id }}\`)"
            echo "Commit: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
