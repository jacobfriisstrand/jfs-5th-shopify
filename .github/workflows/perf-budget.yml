# Perf budget enforcement.
#
# `budget` — builds the theme and runs `scripts/check-budgets.ts`. Fails if any
# per-file cap, per-route budget, or custom-element registration is violated.
# This is the deterministic gate documented in docs/perf-budget.md and ADR-0003
# pillar 3.

name: perf-budget

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  budget:
    name: Check perf budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build theme
        run: npm run build

      - name: Check budgets
        run: npx tsx scripts/check-budgets.ts
